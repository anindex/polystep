name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check release version and changelog
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          version = re.search(r'^__version__ = "([^"]+)"$', Path('src/polystep/__init__.py').read_text(), re.M).group(1)
          citation = Path('CITATION.cff').read_text()
          citation_version = re.search(r'^version: (.+)$', citation, re.M).group(1).strip()
          release_date = re.search(r'^date-released: "([^"]+)"$', citation, re.M).group(1)
          latest = next(line for line in Path('CHANGELOG.md').read_text().splitlines() if line.startswith('## '))
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'release tag must match the package version'
          assert citation_version == version, 'CITATION.cff version must match the package version'
          assert latest == f'## {version} - {release_date}', 'first changelog entry must match the release version and date'
          date.fromisoformat(release_date)
          PY
      - name: Lint the release commit
        run: |
          uvx ruff@0.15.13 check .
          uvx ruff@0.15.13 format --check .
      - name: Build and check distributions
        run: |
          uv build
          uvx twine check --strict dist/*
          uv venv --python 3.12
          for wheel in dist/*.whl; do
            uv pip install "${wheel}[dev]"
          done
          .venv/bin/python -I -c "import importlib.resources, polystep; from polystep import *; assert (importlib.resources.files('polystep') / 'py.typed').is_file()"
      - name: Test the installed wheel with the shipped tests
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q -rs -n auto --maxprocesses=4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/polystep
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
