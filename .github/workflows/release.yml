name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release version and changelog
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.search(r'^__version__ = "([^"]+)"$', Path('src/polystep/__init__.py').read_text(), re.M).group(1)
          citation = re.search(r'^version: (.+)$', Path('CITATION.cff').read_text(), re.M).group(1).strip()
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'release tag must match the package version'
          assert citation == version, 'CITATION.cff version must match the package version'
          assert any(line.startswith(f'## {version} ') for line in Path('CHANGELOG.md').read_text().splitlines()), 'missing changelog entry'
          PY
      - name: Lint and test the release commit
        run: |
          uv pip install --system -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q -rs -n auto
      - name: Build and check distributions
        run: |
          uv build
          uvx twine check --strict dist/*
          uv venv
          for wheel in dist/*.whl; do
            uv pip install "${wheel}[dev]"
          done
          .venv/bin/python -I -c "import importlib.resources, polystep; from polystep import *; assert (importlib.resources.files('polystep') / 'py.typed').is_file()"
      - name: Test the installed wheel with the shipped tests
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q -rs -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Only this job can mint the PyPI token; it runs no repository code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/polystep
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
