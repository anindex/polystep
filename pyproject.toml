[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polystep"
dynamic = ["version"]
description = "PyTorch PolyStep Optimizer - gradient-free neural network training via entropic optimal transport"
authors = [{name = "An T. Le"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.8"]
keywords = ["pytorch", "optimal-transport", "gradient-free", "sinkhorn", "polystep", "optimization", "neural-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/anindex/polystep"
Repository = "https://github.com/anindex/polystep"
Documentation = "https://github.com/anindex/polystep/blob/main/docs/api_overview.md"
Changelog = "https://github.com/anindex/polystep/blob/main/CHANGELOG.md"
Issues = "https://github.com/anindex/polystep/issues"

[project.optional-dependencies]
# Lightweight: just enough for examples/ demos
examples = [
    "numpy>=2.0",
    "torchvision>=0.25",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "gymnasium[classic-control]>=0.29",
    "python-sat",  # example 04 generates its 3-SAT instance through pysat
]
# Core dev: lint + test the library itself (no experiment deps)
dev = [
    "numpy>=2.0",  # the test suite loads MNIST through it
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "pytest-rerunfailures>=14.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",  # -n auto; the suite has no shared mutable state between tests
    "ruff==0.15.13",  # pinned to match CI so `ruff format` never disagrees local vs CI
]
# Full experiment reproduction (paper results, ablations, baselines)
experiments = [
    "numpy>=2.0",  # polystep.benchmarks imports it; the optimizer itself does not
    "pandas>=2.0",
    "python-sat",  # unusual pre-release versioning, left unpinned to stay installable
    "torchvision>=0.25",
    "cma>=3.3",  # run_elevation / run_moe / run_maxsat baselines
    "snntorch>=0.7",  # LIF neurons in benchmarks.utils.SpikingNet
    "datasets>=2.14",  # HuggingFace loader in experiments/runners/run_gpt2_finetune.py
    "transformers>=4.40",  # GPT-2 tokenizer + pretrained weights, same runner
    "gymnasium>=0.29",
]
# RL experiments (Box2D envs)
rl = [
    "gymnasium[box2d]>=0.29",
    "stable-baselines3>=2.3",
    "swig>=4.2",
]

[tool.setuptools.dynamic]
version = {attr = "polystep.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["polystep*"]

[tool.setuptools.package-data]
polystep = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Deferred imports after sys.path manipulation or a long module-level docstring.
# Every entry below suppresses a live violation; the __init__.py F401 entry that used
# to sit here suppressed none, since those modules re-export through __all__.
"src/polystep/optimizer.py" = ["E402"]
"examples/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring CUDA GPU",
    "flaky: retried by pytest-rerunfailures; registered so a missing plugin only skips the retry",
]
# Matches the CI gate, so a local run selects the same tests as a PR. Opt back in
# with `pytest -m gpu` or `pytest -m slow`, which override this.
addopts = "-m 'not slow and not gpu' --timeout=120"
filterwarnings = [
    "ignore:`torch.jit.script_method`:DeprecationWarning",
    "ignore:This process.*is multi-threaded, use of fork:DeprecationWarning",
]
